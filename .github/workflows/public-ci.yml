name: Public Mirror CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    name: Verify projection provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify public projection binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import subprocess

          root = pathlib.Path('.')
          provenance = json.loads((root / '.public-mirror/provenance.json').read_text(encoding='utf-8'))
          manifest_bytes = (root / '.public-mirror/manifest.txt').read_bytes()
          manifest_paths = tuple(sorted(
              line.strip() for line in manifest_bytes.decode('utf-8').splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          ))
          if provenance['schema'] != 'northstar-public-mirror-v1':
              raise SystemExit('unexpected provenance schema')
          if provenance['source_private_repo'] != 'GodParticles1/Northstar':
              raise SystemExit('unexpected private authority')
          if re.fullmatch(r'[0-9a-f]{40}', provenance['source_private_sha']) is None:
              raise SystemExit('source private SHA is not exact')
          if provenance.get('tree_digest_algorithm') != 'northstar-path-blob-v1':
              raise SystemExit('unexpected tree digest algorithm')
          if provenance['projection_paths'] != list(manifest_paths):
              raise SystemExit('projection path list mismatch')
          if hashlib.sha256(manifest_bytes).hexdigest() != provenance['projection_manifest_sha256']:
              raise SystemExit('projection manifest digest mismatch')

          completed = subprocess.run(
              ['git', 'ls-tree', '-r', 'HEAD', '--', *manifest_paths],
              check=True,
              capture_output=True,
          )
          rows = []
          for line in completed.stdout.splitlines():
              meta, path = line.split(b'\t', 1)
              mode, object_type, object_sha = meta.decode('ascii').split(' ', 2)
              if object_type != 'blob' or mode not in {'100644', '100755'}:
                  raise SystemExit('special file found in public projection')
              rows.append((path.decode('utf-8'), object_sha))
          payload = b''.join(
              f'{object_sha}\t{path}\n'.encode('utf-8')
              for path, object_sha in sorted(rows)
          )
          if hashlib.sha256(payload).hexdigest() != provenance['source_projection_git_tree_sha256']:
              raise SystemExit('projected tree digest mismatch')

          workflow_bytes = (root / '.github/workflows/public-ci.yml').read_bytes()
          if hashlib.sha256(workflow_bytes).hexdigest() != provenance['public_ci_workflow_sha256']:
              raise SystemExit('public workflow digest mismatch')
          print('PROVENANCE_GATE=PASS')
          print('PRIVATE_SOURCE_SHA=' + provenance['source_private_sha'])
          PY
      - name: Print public CI identity
        run: echo "PUBLIC_CI_SHA=${{ github.sha }}"

  relay-backflow:
    name: Validate Relay Backflow Contract
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record public projection checkout
        run: git rev-parse HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-learning-dev.txt
      - name: Install existing fixed dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-learning-dev.txt
      - name: Validate source and envelope examples
        run: |
          python scripts/validate_relay_backflow_contract.py testdata/backflow/canonical-source.json
          python scripts/validate_relay_backflow_contract.py testdata/backflow/historical-source.json
          python scripts/validate_relay_backflow_contract.py testdata/backflow/valid-envelope.json --prior testdata/backflow/valid-envelope.json
      - name: Focused contract tests
        run: python -m pytest -q tests/test_relay_backflow_contract.py
      - name: All existing Learning, Beacon and Stage 1 regressions
        run: PYTHONPATH=src python -m pytest -q tests
      - name: Existing validator suites
        run: |
          python scripts/validate_learning_contracts.py --suite testdata/learning-contracts/v2/cases.json
          python scripts/validate_learning_integration.py
          python scripts/validate_beacon_proposal_contract.py
          make validate
      - name: Static checks
        run: |
          ruff check scripts/validate_relay_backflow_contract.py tests/test_relay_backflow_contract.py
          pyright --pythonpath "$(command -v python)" scripts/validate_relay_backflow_contract.py tests/test_relay_backflow_contract.py
          python -m compileall -q scripts/validate_relay_backflow_contract.py tests/test_relay_backflow_contract.py
      - name: Worktree remains clean
        run: test -z "$(git status --porcelain)"

  stage1:
    name: Validate Stage 1
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install fixed proposal schema validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-beacon-proposal-dev.txt
      - name: Validate deterministic Stage 1 model
        run: make validate
